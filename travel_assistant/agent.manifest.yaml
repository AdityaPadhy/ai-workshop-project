# travel_assistant/agent.manifest.yaml — AgentManifest: a parameterized template
# that deployment tooling (azd ai agent init / Foundry Toolkit) reads to scaffold
# your hosted agent. It has top-level metadata (name, description, tags), a
# `template` block (the hosted-agent definition), and a `resources` list.
# This file is provided ready to use — skim it so you know what it declares.
# Reference (each field explained):
# https://learn.microsoft.com/azure/foundry/agents/concepts/agent-yaml-reference
# NOTE: `name` (and `template.name` below) must be a hardcoded literal here — do
# NOT use ${VAR} or {{VAR}}. `azd ai agent init` reads and validates the agent
# name as-is, BEFORE any substitution: it never expands ${VAR} (those resolve later
# at deploy/run from .env / Bicep outputs) and only substitutes {{VAR}} for values
# declared under a `parameters:` block, which happens AFTER the name is validated.
# The validator rejects `$`, `{`, and `}`, so a placeholder here fails with
# "invalid agent name". The runtime-configurable prefix still lives in agent.yaml's
# `name` and in the WORKSHOP_RESOURCE_PREFIX environment variable below.
name: travel-buddy
description: >
  TravelBuddy is an Agent Framework hosted agent with local Python function tools
  for weather, local time, and currency, plus a Foundry Toolbox that bundles web
  search, Code Interpreter, and the OctoTrip flights MCP server behind one
  project-managed endpoint, and RAG grounding over a curated
  destinations index in Azure AI Search.
metadata:
  tags:
    - Agent Framework
    - AI Agent Hosting
    - Azure AI AgentServer
    - Responses Protocol
    - Travel Assistant
    - Function Tools
    - MCP Tools
    - Toolbox tools
    - RAG
   
  tool_declarations:     # <-- added: describes the three tools for anyone browsing the agent
    - name: get_weather
      description: Returns mock destination weather for a city and optional date.
      parameters:
        city: string
        date: "string | null"
    - name: get_local_time
      description: Returns the current local time for a destination city.
      parameters:
        city: string
    - name: convert_currency
      description: Converts mock travel prices between USD, EUR, JPY, and GBP.
      parameters:
        amount: float
        from_currency: string
        to_currency: string 
    - name: travel-toolbox                       # <-- replaces the octotrip-flights mcp entry
      description: >
        Foundry Toolbox bundling web_search, code_interpreter, and the OctoTrip
        flights MCP server, consumed from one project-managed endpoint.
      type: toolbox
      endpoint: ${TOOLBOX_ENDPOINT}  
    - name: travelbuddy_destinations     # <-- added: the retrieval surface
      description: >
        Azure AI Search retrieval over the curated destinations index; injects the
        top-k matching destination records into context before each turn.
      type: azure_ai_search
      endpoint: ${AZURE_AI_SEARCH_ENDPOINT}         
template:
  name: travel-buddy
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    - name: AZURE_AI_PROJECT_ENDPOINT
      value: ${AZURE_AI_PROJECT_ENDPOINT}
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    - name: WORKSHOP_RESOURCE_PREFIX
      value: ${WORKSHOP_RESOURCE_PREFIX}
    - name: TOOLBOX_ENDPOINT         # <-- added
      value: ${TOOLBOX_ENDPOINT}
    - name: AZURE_AI_SEARCH_ENDPOINT     # <-- added
      value: ${AZURE_AI_SEARCH_ENDPOINT}
    - name: AZURE_AI_SEARCH_INDEX_NAME   # <-- added
      value: ${AZURE_AI_SEARCH_INDEX_NAME}  
    
# No provisioned resources: you already deployed a model in setup (Step 0), and the
# agent selects it at runtime through the AZURE_AI_MODEL_DEPLOYMENT_NAME env var
# above — so we don't declare a `kind: model` resource for azd to create.
resources: []